name: Probe what the guest is doing when node-agent reaps it

# Why this exists
#
# Runner jobs on the sandbox path die with `runner job: failed
# reason=guest_disconnected`. That verdict is downstream noise: the host log
# shows node-agent's own liveness reaper firing first —
#
#   sandbox guest-agent liveness failure started  failure_stage=response_read reason=timeout
#   ... 12 consecutive failures, grace 2m0s ...
#   sandbox session terminal forensics  cause=guest_agent_liveness
#   reaping dead sandbox session
#
# — i.e. the guest stopped answering the vsock liveness ping for two minutes and
# node-agent killed the VM with the customer's job still running. In every
# sample so far cloud-hypervisor itself is `State: S (sleeping)`, the vsock
# socket is still present and the console is silent, so the VM is fine and the
# guest-agent alone is unresponsive.
#
# Two sub-shapes appear in the forensics, and they want different fixes:
#   a) evidence=guest_memory_pressure_without_observed_oom — allocstall in the
#      millions, MemFree near zero. The guest is thrashing in reclaim.
#   b) evidence=guest_resources_not_pressured_at_last_sample — gigabytes free,
#      vmstat empty, failure_stage=handshake_read. Nothing explains it yet.
#
# node-agent can only sample the guest through the very channel that is failing,
# so its forensics stop exactly when the answer would get interesting. This probe
# takes the same measurements from inside, on a timer the vsock cannot block.
#
# Report-only: never fails the job. Prints counters and classifications only —
# this repository and its logs are public.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner pool to probe"
        required: false
        default: "tenki-standard-autoscale"
        type: string
      minutes:
        description: "How long each profile runs"
        required: false
        default: "18"
        type: string
      profiles:
        description: 'JSON array of profiles to run, e.g. ["iostall"]'
        required: false
        default: '["idle","iostall","memreclaim","jobshaped"]'
        type: string

jobs:
  probe:
    runs-on: ${{ inputs.runner_label || 'tenki-standard-autoscale' }}
    # Hard cap. Two earlier rounds overran their own deadline because a stressor
    # iteration is only interruptible between rounds, and held premium VMs for
    # 50 minutes. Nothing below is allowed to outlive this. Fixed rather than
    # derived from `minutes` because workflow expressions have no arithmetic;
    # raise it by hand if `minutes` goes above ~25.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # idle is the control: if the guest goes silent with nothing running,
        # the shape is the platform's alone and no workload triggers it. CPU
        # saturation is already a settled negative (loadavg 18.2 on 8 vCPU for 18
        # minutes, zero liveness failures), so what remains to test is I/O.
        profile: ${{ fromJSON(inputs.profiles || '["idle","iostall","memreclaim","jobshaped"]') }}
    steps:
      - name: Install the sampler
        run: |
          set +e
          mkdir -p /tmp/probe
          cat > /tmp/probe/sample.sh <<'SAMPLER'
          #!/bin/sh
          # One line per tick, same counters node-agent puts in its terminal
          # forensics, so a reap can be lined up against the guest's own view.
          vmstat_val() { awk -v k="$1" '$1==k {print $2; found=1} END{if(!found) print "na"}' /proc/vmstat; }
          mem_val()    { awk -v k="$1" '$1==k":" {print $2; found=1} END{if(!found) print "na"}' /proc/meminfo; }

          # The guest-agent is the process whose liveness node-agent is judging.
          agent_pid() {
            for p in /proc/[0-9]*; do
              # comm is world-readable; exe is not, for a root-owned process.
              c=$(cat "$p/comm" 2>/dev/null) || continue
              case "$c" in
                sandbox|guest-agent|vm-agent)
                  # Confirm it is the guest-agent and not a same-named child.
                  [ "$(cut -d' ' -f4 "$p/stat" 2>/dev/null)" = "1" ] || continue
                  basename "$p"; return ;;
              esac
            done
            echo ""
          }

          AP=$(agent_pid)
          TICK=0
          while :; do
            TICK=$((TICK + 1))
            if [ -z "$AP" ] || [ ! -d "/proc/$AP" ]; then AP=$(agent_pid); fi
            if [ -n "$AP" ] && [ -d "/proc/$AP" ]; then
              AST=$(awk '/^State:/{print $2}' "/proc/$AP/status" 2>/dev/null)
              ATH=$(awk '/^Threads:/{print $2}' "/proc/$AP/status" 2>/dev/null)
              ARSS=$(awk '/^VmRSS:/{print $2}' "/proc/$AP/status" 2>/dev/null)
              AFD=$(sudo ls "/proc/$AP/fd" 2>/dev/null | wc -l)
              # D means blocked in the kernel - the state a stalled rootfs
              # produces, and the one a 3s liveness deadline cannot survive.
              AWC=$(sudo cat "/proc/$AP/wchan" 2>/dev/null | tr -d '\0' | cut -c1-24)
            else
              AST=gone; ATH=na; ARSS=na; AFD=na; AWC=na
            fi
            printf 'tick=%s t=%s agent_pid=%s agent_state=%s agent_threads=%s agent_rss_kb=%s agent_fds=%s agent_wchan=%s procs=%s loadavg=%s memfree_kb=%s memavail_kb=%s allocstall_normal=%s pgscan_kswapd=%s pgscan_direct=%s\n' \
              "$TICK" "$(date -u +%H:%M:%S)" "${AP:-none}" "$AST" "$ATH" "$ARSS" "$AFD" "${AWC:-na}" \
              "$(ls -d /proc/[0-9]* 2>/dev/null | wc -l)" \
              "$(cut -d' ' -f1-3 /proc/loadavg)" \
              "$(mem_val MemFree)" "$(mem_val MemAvailable)" \
              "$(vmstat_val allocstall_normal)" "$(vmstat_val pgscan_kswapd)" "$(vmstat_val pgscan_direct)"

            # Survives the VM being reaped: node-agent's `guest process snapshot`
            # carries every process's full exe path, so the newest of these file
            # names is readable from the host even when this job's stdout never
            # reaches GitHub.
            [ -n "${MARKER_PID:-}" ] && kill "$MARKER_PID" 2>/dev/null
            rm -f /tmp/TENKI-LIVEPROBE-* 2>/dev/null
            M="/tmp/TENKI-LIVEPROBE-t${TICK}-agent${AST}-fds${AFD}-rss${ARSS}"
            if cp /bin/sleep "$M" 2>/dev/null; then "$M" 1800 & MARKER_PID=$!; fi
            sleep 5
          done
          SAMPLER
          chmod +x /tmp/probe/sample.sh
          echo "sampler_installed=yes"
          echo "profile=${{ matrix.profile }}"
          echo "mem_total_kb=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)"
          echo "nproc=$(nproc)"

      - name: Run profile under the sampler
        run: |
          set +e
          MINUTES="${{ inputs.minutes || '18' }}"
          /tmp/probe/sample.sh &
          SAMPLER_PID=$!
          END=$(( $(date +%s) + MINUTES * 60 ))

          case "${{ matrix.profile }}" in
            idle)
              while [ "$(date +%s)" -lt "$END" ]; do sleep 10; done
              ;;

            iostall)
              # CPU saturation was tested and cleared: loadavg 18.2 on 8 vCPU for
              # 18 minutes produced zero liveness failures. The customer's guest
              # was I/O-heavy instead - its process table is full of
              # kworker/u128:*-iou_exit and jbd2/vda-8 - and the failure stage is
              # response_read, which is what a guest blocked in D state on its
              # RBD-backed rootfs would produce. So: saturate the disk.
              #
              # Every operation is individually bounded. A 512MB O_DIRECT|O_SYNC
              # write on a contended volume can outlive the whole run on its own,
              # which is how the previous rounds overran.
              N=$(( $(nproc) * 2 ))
              i=0
              while [ "$i" -lt "$N" ]; do
                (
                  f="/tmp/probe/io.$i"
                  while [ "$(date +%s)" -lt "$END" ]; do
                    timeout 30 dd if=/dev/zero of="$f" bs=1M count=128 oflag=direct,sync 2>/dev/null
                    timeout 30 dd if="$f" of=/dev/null bs=4k iflag=direct 2>/dev/null
                    rm -f "$f"
                  done
                ) & i=$((i + 1))
              done
              # fsync storm on the journal, which is what jbd2/vda-8 shows.
              (
                while [ "$(date +%s)" -lt "$END" ]; do
                  timeout 30 sh -c 'i=0; while [ "$i" -lt 3000 ]; do echo x > "/tmp/probe/j$i"; sync "/tmp/probe/j$i" 2>/dev/null; i=$((i+1)); done'
                  rm -f /tmp/probe/j*
                done
              ) &
              while [ "$(date +%s)" -lt "$END" ]; do sleep 5; done
              pkill -P $$ 2>/dev/null
              rm -f /tmp/probe/io.* /tmp/probe/j* 2>/dev/null
              ;;

            memreclaim)
              # Target state, taken from the second of the customer's two reaps
              # (session 01a092e9): MemAvailable 220MB of 17GB, allocstall 81554,
              # pgscan_direct 21.2M. Its VM was thrashing, not merely full.
              #
              # Two earlier attempts failed to get anywhere near it. Filling page
              # cache costs the kernel nothing (it is reclaimable, allocstall
              # stayed 0), and /dev/shm defaults to half of RAM so a dd sized
              # above that just hits ENOSPC. What is needed is anonymous memory
              # that stays referenced, so every reclaim scan finds it hot and has
              # to keep scanning.
              python3 - <<'HOG' &
              import os, time
              total = int(next(l.split()[1] for l in open('/proc/meminfo') if l.startswith('MemTotal')))
              # Leave a little headroom so the OOM killer stays out of it for a
              # while: the goal is sustained reclaim, not a kill.
              target = int(total * 0.92) * 1024
              chunk, held = 64 << 20, []
              try:
                  while sum(len(b) for b in held) < target:
                      b = bytearray(chunk)
                      for off in range(0, chunk, 4096):
                          b[off] = 1
                      held.append(b)
              except MemoryError:
                  pass
              # Keep every page referenced so it cannot be cheaply evicted.
              while True:
                  for b in held:
                      for off in range(0, len(b), 4096):
                          b[off] = (b[off] + 1) & 0xFF
                  time.sleep(0.1)
              HOG
              HOG_PID=$!
              while [ "$(date +%s)" -lt "$END" ]; do sleep 5; done
              kill -9 "$HOG_PID" 2>/dev/null
              ;;

            jobshaped)
              # The customer's job in miniature, sized to the runner: a Postgres
              # service container plus one Node worker per core, each allocating
              # and churning, restarted in short bounded rounds so the deadline
              # is honoured.
              docker run -d --name probe-pg -e POSTGRES_PASSWORD=probe postgres:18 >/dev/null 2>&1
              echo "pg_started=$?"
              while [ "$(date +%s)" -lt "$END" ]; do
                i=0
                while [ "$i" -lt "$(nproc)" ]; do
                  timeout 60 node -e 'const t=Date.now();while(Date.now()-t<55000){const a=[];for(let i=0;i<4e5;i++)a.push({i,s:"x".repeat(64)});}' >/dev/null 2>&1 &
                  i=$((i + 1))
                done
                wait
              done
              docker rm -f probe-pg >/dev/null 2>&1
              ;;
          esac

          kill "$SAMPLER_PID" 2>/dev/null
          echo "profile_completed=yes"

      - name: Verdict
        if: always()
        run: |
          set +e
          echo "profile=${{ matrix.profile }}"
          echo "job_reached_final_step=yes"
          echo "surviving_probe_markers=$(ls /tmp/TENKI-LIVEPROBE-* 2>/dev/null | wc -l)"
          ls /tmp/TENKI-LIVEPROBE-* 2>/dev/null | tail -1
