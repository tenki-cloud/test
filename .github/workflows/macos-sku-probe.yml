name: macOS SKU probe

# Measures, from inside the job, what a macOS SKU actually delivers: OS build,
# usable disk, vCPU/RAM, SoC generation, and the toolchain the image ships.
#
# Written for the "macOS Runners: SKU Refresh" discussion, whose two open items
# are disk and OS version. Both are claims about the guest, so both are settled
# from inside the guest rather than from runner_offerings rows.
#
# Notes on the two disk numbers this prints:
#   - `/` is the sealed read-only System volume; its "used" is the OS itself.
#   - Everything a job writes lands on /System/Volumes/Data, and both volumes
#     share one APFS container. So the sellable number is the container size,
#     and the number that decides whether Xcode + simulators fit is Data avail.
#
# Report-only: no step fails the job, and a missing tool is a finding, not an
# error. This repository is public, so no environment dump - only an explicit
# allowlist of non-sensitive variables is printed.
#
# Run it:  Actions tab -> "macOS SKU probe" -> Run workflow
#     or:  gh workflow run macos-sku-probe.yml
#          gh workflow run macos-sku-probe.yml -f labels='["tenki-macos-26-small"]'

on:
  workflow_dispatch:
    inputs:
      labels:
        description: JSON array of macOS runner labels to probe
        default: '["tenki-macos-26-small","tenki-macos-latest-small","tenki-macos-26-mini","tenki-macos-latest-mini"]'
        type: string
      write_test_mb:
        description: Sequential write test size in MB (0 skips it)
        default: "1024"
        type: string

jobs:
  probe:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        label: ${{ fromJSON(inputs.labels) }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 30
    env:
      LABEL: ${{ matrix.label }}
      WRITE_TEST_MB: ${{ inputs.write_test_mb }}
    steps:
      - name: OS and image identity
        shell: bash
        run: |
          set +e
          echo "=== sw_vers ==="
          sw_vers
          echo
          echo "=== kernel ==="
          uname -a
          echo "kern.osproductversion : $(sysctl -n kern.osproductversion 2>/dev/null)"
          echo "kern.osversion        : $(sysctl -n kern.osversion 2>/dev/null)"
          echo "kern.hv_vmm_present   : $(sysctl -n kern.hv_vmm_present 2>/dev/null)  # 1 = running as a VM guest"
          echo
          echo "=== runner-provided identity (allowlisted vars only) ==="
          for v in ImageOS ImageVersion RUNNER_OS RUNNER_ARCH RUNNER_NAME RUNNER_ENVIRONMENT; do
            printf '%-20s: %s\n' "$v" "${!v}"
          done
          echo
          echo "=== image manifest files, if the image ships one ==="
          for p in "$HOME/image-info" "$HOME/image.json" /imagegeneration/imagedata.json \
                   /usr/local/share/image-info /Users/runner/runner-images-version.txt; do
            [ -e "$p" ] && { echo "--- $p"; head -c 2000 "$p"; echo; }
          done
          echo "--- \$HOME contents ---"
          ls -1 "$HOME" 2>/dev/null | head -20
          exit 0

      - name: CPU, memory, SoC generation
        shell: bash
        run: |
          set +e
          echo "=== delivered to the guest ==="
          NCPU=$(sysctl -n hw.ncpu 2>/dev/null)
          MEMB=$(sysctl -n hw.memsize 2>/dev/null)
          echo "hw.ncpu               : $NCPU"
          echo "hw.physicalcpu        : $(sysctl -n hw.physicalcpu 2>/dev/null)"
          echo "hw.memsize            : $MEMB  ($(( MEMB / 1024 / 1024 )) MiB)"
          echo "hw.pagesize           : $(sysctl -n hw.pagesize 2>/dev/null)"
          echo "hw.model              : $(sysctl -n hw.model 2>/dev/null)  # VirtualMac* = Virtualization.framework guest"
          echo
          echo "=== core topology (a VF guest usually exposes a single perf level) ==="
          sysctl -a 2>/dev/null | grep -E '^hw\.(nperflevels|perflevel[0-9]+\.(name|physicalcpu|logicalcpu))'
          echo
          echo "=== SoC generation fingerprint ==="
          echo "FEAT_SME identifies M4 and newer; BF16/I8MM identify M2 and newer."
          for f in FEAT_SME FEAT_SME2 FEAT_BF16 FEAT_I8MM FEAT_FP16 FEAT_DotProd FEAT_LSE2; do
            printf '%-16s: %s\n' "$f" "$(sysctl -n hw.optional.arm.$f 2>/dev/null || echo absent)"
          done
          echo
          echo "=== swap ==="
          sysctl -n vm.swapusage 2>/dev/null
          echo
          echo "=== system_profiler (brief) ==="
          system_profiler SPHardwareDataType 2>/dev/null | sed -n '1,20p'
          exit 0

      - name: Disk geometry and headroom
        shell: bash
        run: |
          set +e
          echo "=== df -h, every mount ==="
          df -h
          echo
          echo "=== the three numbers that matter ==="
          df -k / | tail -1 | awk '{printf "/                      total %6.1f GB  avail %6.1f GB\n", $2/1048576, $4/1048576}'
          df -k /System/Volumes/Data | tail -1 | awk '{printf "/System/Volumes/Data   total %6.1f GB  avail %6.1f GB\n", $2/1048576, $4/1048576}'
          df -k "${GITHUB_WORKSPACE:-$HOME}" | tail -1 | awk '{printf "workspace volume       total %6.1f GB  avail %6.1f GB\n", $2/1048576, $4/1048576}'
          echo
          echo "=== APFS container, the actual size of the virtual disk ==="
          diskutil apfs list 2>/dev/null | grep -E 'APFS Container|Capacity Ceiling|Capacity In Use|Physical Store|APFS Volume Disk|Capacity Consumed'
          echo
          echo "=== diskutil list ==="
          diskutil list 2>/dev/null
          echo
          echo "=== read-only vs writable mounts ==="
          mount | grep -E 'on / |on /System/Volumes/Data '
          exit 0

      - name: What already occupies the disk before checkout
        shell: bash
        run: |
          set +e
          echo "Sizes of the toolchain a fresh job inherits. This is the number the"
          echo "SKU discussion needs: what is left for a real iOS build."
          echo
          for p in /Applications/Xcode*.app \
                   /Library/Developer/CoreSimulator \
                   "$HOME/Library/Developer/CoreSimulator" \
                   /Library/Developer/CommandLineTools \
                   /opt/homebrew /usr/local/Homebrew /usr/local/Cellar \
                   "$HOME/.rubies" "$HOME/Library/Android" /usr/local/lib/node_modules; do
            [ -e "$p" ] || continue
            KB=$(du -skx "$p" 2>/dev/null | awk '{print $1}')
            [ -n "$KB" ] && awk -v kb="$KB" -v path="$p" 'BEGIN{printf "%10.2f GB  %s\n", kb/1048576, path}'
          done
          exit 0

      - name: Sequential write throughput
        shell: bash
        run: |
          set +e
          MB="${WRITE_TEST_MB:-512}"
          case "$MB" in ''|*[!0-9]*) MB=0 ;; esac
          if [ "$MB" -eq 0 ]; then echo "skipped by input"; exit 0; fi
          AVAIL_MB=$(df -k "${GITHUB_WORKSPACE:-$HOME}" | tail -1 | awk '{print int($4/1024)}')
          echo "avail: ${AVAIL_MB} MB, test size: ${MB} MB"
          if [ "$AVAIL_MB" -lt $(( MB + 2048 )) ]; then
            echo "not enough headroom to test safely; skipping"
            echo "(a skip here is itself a finding: the SKU has no room for a 1 GB scratch file)"
            exit 0
          fi
          F="${GITHUB_WORKSPACE:-$HOME}/.ddtest"
          now() { perl -MTime::HiRes=time -e 'printf "%.6f\n", time'; }
          START=$(now)
          dd if=/dev/zero of="$F" bs=1m count="$MB" 2>&1 | tail -1
          sync
          END=$(now)
          rm -f "$F"
          awk -v mb="$MB" -v s="$START" -v e="$END" \
            'BEGIN{d=e-s; if(d<=0.001)d=0.001; printf "write: %.0f MB/s over %.2fs (dd + sync)\n", mb/d, d}'
          exit 0

      - name: Apple toolchain inventory
        shell: bash
        run: |
          set +e
          echo "=== Xcode ==="
          echo "xcode-select -p : $(xcode-select -p 2>&1)"
          xcodebuild -version 2>&1 | tr '\n' ' '; echo
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            V=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist" 2>/dev/null)
            echo "installed: $app -> $V"
          done
          echo
          echo "=== SDKs ==="
          xcodebuild -showsdks 2>&1 | sed -n '1,40p'
          echo
          echo "=== simulator runtimes ==="
          xcrun simctl list runtimes 2>&1
          echo
          echo "=== App Store Connect / notarization tooling ==="
          printf 'notarytool : %s\n' "$(xcrun notarytool --version 2>&1 | head -1)"
          printf 'altool     : %s\n' "$(xcrun altool --version 2>&1 | head -2 | tr '\n' ' ')"
          printf 'fastlane   : %s\n' "$(fastlane --version 2>&1 | grep -i '^fastlane' | head -1)"
          exit 0

      - name: Cross-platform framework support
        shell: bash
        run: |
          set +e
          echo "React Native and Flutter are the two the SKU discussion asked about."
          echo "ABSENT means the tool is not on PATH in this image."
          echo
          probe() {
            local bin="${2%% *}"
            if command -v "$bin" >/dev/null 2>&1; then
              printf '%-14s: %s\n' "$1" "$(eval "$2" 2>&1 | head -1)"
            else
              printf '%-14s: ABSENT\n' "$1"
            fi
          }
          probe node        'node -v'
          probe npm         'npm -v'
          probe yarn        'yarn -v'
          probe pnpm        'pnpm -v'
          probe watchman    'watchman --version'
          probe cocoapods   'pod --version'
          probe ruby        'ruby -v'
          probe swift       'swift --version'
          probe flutter     'flutter --version'
          probe dart        'dart --version'
          probe java        'java -version'
          probe gradle      'gradle --version | grep Gradle'
          probe python3     'python3 -V'
          probe brew        'brew -v'
          probe git         'git --version'
          probe gh          'gh --version'
          exit 0

      - name: Collect row
        shell: bash
        run: |
          set +e
          OSV="$(sw_vers -productVersion 2>/dev/null) ($(sw_vers -buildVersion 2>/dev/null))"
          NCPU=$(sysctl -n hw.ncpu 2>/dev/null)
          RAM=$(sysctl -n hw.memsize 2>/dev/null | awk '{printf "%.0f", $1/1073741824}')
          TOTAL=$(df -k /System/Volumes/Data | tail -1 | awk '{printf "%.0f", $2/1048576}')
          FREE=$(df -k /System/Volumes/Data | tail -1 | awk '{printf "%.0f", $4/1048576}')
          XC=$(xcodebuild -version 2>/dev/null | head -1 | awk '{print $2}')
          RT=$(xcrun simctl list runtimes 2>/dev/null | grep -c 'com.apple.CoreSimulator.SimRuntime')
          FL=$(flutter --version >/dev/null 2>&1 && echo yes || echo no)
          SME=$(sysctl -n hw.optional.arm.FEAT_SME 2>/dev/null || echo "-")
          printf '| `%s` | %s | %s | %s GB | %s GB | %s GB | %s | %s | %s | %s |\n' \
            "$LABEL" "$OSV" "$NCPU" "$RAM" "$TOTAL" "$FREE" "${XC:-none}" "$RT" "$FL" "${SME:--}" > row.md
          cat row.md >> "$GITHUB_STEP_SUMMARY"
          cat row.md
          exit 0

      - name: Upload row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: row-${{ matrix.label }}
          path: row.md
          if-no-files-found: warn

  summary:
    name: Comparison table
    needs: probe
    if: always()
    runs-on: tenki-standard-small-2c-4g
    steps:
      - name: Download rows
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: row-*
          path: rows

      - name: Render
        shell: bash
        run: |
          set +e
          {
            echo "## macOS SKU probe"
            echo
            echo "| label | OS (build) | vCPU | RAM | disk total | disk free | Xcode | sim runtimes | flutter | FEAT_SME |"
            echo "| -- | -- | -- | -- | -- | -- | -- | -- | -- | -- |"
            find rows -name 'row.md' -exec cat {} \; 2>/dev/null | sort
            echo
            echo "disk total / free are for \`/System/Volumes/Data\`, the volume a job writes to."
            echo "FEAT_SME = 1 indicates an M4-generation or newer host SoC."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          exit 0
